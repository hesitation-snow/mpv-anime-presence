# ==============================================================================
# mpv Discord Rich Presence Configuration
# GitHub-ready, zero-dependency native LuaJIT integration for mpv
# ==============================================================================

# 插件开关与快捷键 / Master switch & Toggle hotkey
enabled=yes
key=Ctrl+d

# 插件显示语言 / Language for status text and OSD: "zh" or "en"
language=en

# 番剧标题偏好 / Title preference for matched anime: "translated" or "original"
# - "translated": 显示中文/本地化译名 (e.g. 抽烟猫 / 更衣人偶坠入爱河 / 葬送的芙莉莲)
# - "original"  : 显示日文原名 (e.g. ヤニねこ / その着せ替え人形は恋をする / 葬送のフリーレン)
title_preference=original

# 播放时是否隐藏状态行的总时长 / Hide duration text in state line during playback
# Discord 底部已有实时播放进度条与倒计时，开启此项可避免时长文字重复显示。
# 暂停时依然会保留精准时间点显示 (e.g. 已暂停 · 12:34 / 24:00)。
hide_duration_on_play=yes

# 是否将第一行详情替换为正规番剧名 / Replace details line with matched anime title
# - no : 保留文件名与集数 (e.g. [LoliHouse] Yani Neko - 01 [WebRip...])
# - yes: 替换为正规番名 (e.g. 抽烟猫 或 ヤニねこ)
details_use_anime_title=yes

# 是否自动从 Bangumi 匹配高清动画海报作为大图标 / Enable Bangumi cover art
cover_art=yes

# 是否显示正在播放的视频标题 / Show video title to friends
# 设为 no 时仅显示通用的“正在观看视频 (Watching Video)”，保护隐私。
show_title=yes

# ==============================================================================
# 高级设置 / Advanced settings
# ==============================================================================
client_id=737663962677510245
activity_type=3
update_interval=15
min_update_interval=5
reconnect_interval=5
log_updates=no
pipe_prefix=discord-ipc-
